[project]
name = "testmate-backend"
version = "0.1.0"
description = "TestMate backend gateway - FastAPI middle layer wrapping Dify/RAGFlow"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.30",
  "aiomysql>=0.2.0",
  "alembic>=1.13.0",
  "redis>=5.0.0",
  "httpx>=0.27.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "python-multipart>=0.0.9",
  "paramiko>=3.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff>=0.5.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# 全部用例共用**一个**事件循环: SQLAlchemy 的连接池是绑在创建它的 loop 上的,
# 每个用例开新 loop 会让池里的连接失效 (跨 loop 使用报错)
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-q --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]
