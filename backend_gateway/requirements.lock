# TestMate Backend — 依赖锁文件 (完全固定版本)
#
# 为什么要有它:
#   requirements.txt 用的是 `>=`, 每次重建镜像装到的都是**当时最新**的版本.
#   历史上两次重建分别踩到过不同的坑 (如 sqlalchemy 2.1 把 greenlet 拆成可选
#   依赖, 不显式装就在 import 时报 ImportError). 依赖漂移导致的故障极难复现.
#
# 怎么维护:
#   1. 改 requirements.txt 里的**直接依赖** (不写版本也行, 只管顶层)
#   2. 重建镜像, 进容器执行 `pip freeze` 得到实际装上的版本集
#   3. 把结果同步回本文件
#   本文件的版本来自**已验证可运行**的环境, 不是凭空猜的.
#
# 与 requirements.txt 的关系:
#   requirements.txt      —— 顶层直接依赖 (人读, 声明"我们依赖什么")
#   requirements.lock     —— 完整闭包 + 精确版本 (机器读, 保证可复现构建)
#
# ⚠️ 改这里之后必须重建镜像并跑一遍冒烟, 别只改文件不验证.

