server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  add_header Pragma "no-cache" always;
  add_header Expires "0" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    # mac 本地 docker-compose: 后端是容器, 走 docker 内部 DNS "backend:8000"
    # 86 生产: backend 是宿主机 nohup uvicorn 进程, 应改为 http://172.21.0.1:8000 (testmate-net 网关直连宿主机)
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;
    proxy_buffering off;
  }

  # ===== 软件库 (2026-10-27) =====
  # 软件包最大 5G —— 这个 location 单独放大 body 上限 (server 级是 1m).
  # ⚠️ proxy_request_buffering off 是关键: 默认 nginx 会先把整个 body 收进
  #    临时目录再转给后端 —— 5G 会在容器可写层**再存一份**, 磁盘翻倍.
  # ⚠️ 路径必须带 v1 —— 后端挂的是 /api/v1/software.
  # ⚠️ 结尾**不能带斜杠** —— nginx 对 "location /xxx/" 会自动 301 补斜杠,
  #    而 FastAPI 的路由没斜杠 (会 307 弹回来) → 重定向死循环, 端口还会被吞掉.
  location /api/v1/software {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 6g;
    proxy_request_buffering off;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_buffering off;
  }
}
